spring:
  application:
    name: naming-center
  profiles:
    include:
    - oauth
  thymeleaf:
    enabled: true
    prefix: classpath:/templates/
    suffix: .html
  datasource:
    driver-class-name: oracle.jdbc.OracleDriver
    url: jdbc:oracle:thin:@localhost:1521/XEPDB1
    username: namingcenter
    password: java1234
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  jpa:
    hibernate:
      ddl-auto: update # 테이블 자동 생성 전략 (none, create, create-drop, update, validate)
    show-sql: true # SQL 쿼리 로그 출력
    properties:
      hibernate:
        "[format_sql]": true # SQL 쿼리 로그 포맷팅 
        dialect: org.hibernate.dialect.OracleDialect # Oracle 12c+ 방언

# JWT 설정 추가
jwt:
   secret: ThisIsASecretKeyForJWTAuthentication123!@#$%^&*
   expiration: 86400000  # 24시간 (밀리초 단위)
   refresh-expiration: 604800000  # 7일 (밀리초 단위)

file:
  upload:
     dir: src/main/resources/static/uploads